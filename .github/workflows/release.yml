name: release

on:
  push:
    tags:
      - "v*"

# id-token: write lets npm exchange the GitHub OIDC token for a short-lived
# publish credential (trusted publishing). No long-lived npm token exists.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url here: setup-node would write an (empty) NODE_AUTH_TOKEN
      # line into .npmrc, which shadows the OIDC trusted-publishing exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing requires npm >= 11.5.1; node 22 bundles npm 10.
      - run: npm install -g npm@latest

      - run: npm test

      - run: npm publish --provenance --access public
